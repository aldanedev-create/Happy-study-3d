<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Happy Study 3D - Free CXC, CAPE & Software Engineering Study App</title>
    <meta name="title" content="Happy Study 3D - Free CXC, CAPE & Software Engineering Study App" />
    <meta name="description" content="Free educational PWA for CXC, CAPE, and Software Engineering with interactive 3D study environment. Learn, practice, and track your progress." />
    <meta name="author" content="Happy Study 3D" />
    <meta name="keywords" content="CXC, CAPE, CSEC, study app, software engineering, 3D learning, Caribbean education, exam preparation" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="dark light" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://happystudy3d.vercel.app/" />
    <meta property="og:title" content="Happy Study 3D - Free CXC, CAPE & Software Engineering Study App" />
    <meta property="og:description" content="Interactive 3D study environment for CXC, CAPE, and Software Engineering. Learn, practice, and track your progress." />
    <meta property="og:image" content="/icons/icon-512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://happystudy3d.vercel.app/" />
    <meta property="twitter:title" content="Happy Study 3D - Free CXC, CAPE & Software Engineering Study App" />
    <meta property="twitter:description" content="Interactive 3D study environment for CXC, CAPE, and Software Engineering." />
    <meta property="twitter:image" content="/icons/icon-512.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="application-name" content="Happy Study 3D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Happy Study 3D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Fonts (Optional - can be removed if using system fonts) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalApplication",
        "name": "Happy Study 3D",
        "url": "https://happystudy3d.vercel.app/",
        "description": "Free educational PWA for CXC, CAPE, and Software Engineering with interactive 3D study environment",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "audience": {
          "@type": "EducationalAudience",
          "educationalRole": "student",
          "audienceType": "CXC, CAPE, and Software Engineering students"
        },
        "featureList": [
          "3D Interactive Study Environment",
          "CXC/CSEC Curriculum",
          "CAPE Curriculum",
          "Software Engineering Curriculum",
          "Progress Tracking",
          "Audio Studio",
          "Exam Practice",
          "Offline Access"
        ]
      }
    </script>
    
    %sveltekit.head%
  </head>
  
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
